name: Backend checks
on:
  push:
    branches: [codex/transportlah-foundation]
    paths: ['backend/**', 'tools/**', 'requirements*', '.github/workflows/**', 'Dockerfile', 'docker-compose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: transportlah
          POSTGRES_USER: transportlah
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transportlah -d transportlah"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Policy, identity, real PostGIS and transaction checks
        env:
          TEST_DATABASE_URL: postgresql://transportlah:${{ github.run_id }}-${{ github.run_attempt }}-ci-postgres-only@127.0.0.1:5432/transportlah
          TL_TEST_DATABASE_CONFIRMED: '1'
          TL_REQUIRE_DATABASE: '1'
          DATABASE_URL: postgresql://transportlah:${{ github.run_id }}-${{ github.run_attempt }}-ci-postgres-only@127.0.0.1:5432/transportlah
          REDIS_URL: redis://127.0.0.1:6379/0
          LTA_MODE: OFFLINE_FIXTURE
          LTA_CAPTURE_DIR: backend/tests/data
          API_SERVICE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-ci-service-authorization-only
        run: python tools/run_checks.py --output-dir receipts/cloud_high
      - name: Preserve executed receipts even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-foundation-receipts
          path: receipts/cloud_high
          retention-days: 30
          if-no-files-found: error
